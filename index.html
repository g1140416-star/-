<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今天吃什麼？台灣鹹食美食抽籤筒</title>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFFDF2;
      --card-bg: #FFFFFF;
      --primary-yellow: #FFE066;
      --soft-yellow: #FFF2B2;
      --soft-pink: #FFD1DC;
      --accent-orange: #FF9B42;
      --text-color: #5A4A42;
      --light-text: #9E8E85;
      --border-color: #F7E7C4;
      --shadow: 0 10px 25px rgba(230, 190, 100, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 14px 30px 14px;
      background-image: radial-gradient(var(--border-color) 1.5px, transparent 1.5px);
      background-size: 18px 18px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 360px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .sub-title {
      font-size: 0.85rem;
      color: var(--light-text);
      font-weight: 700;
    }

    /* 籤筒區域 */
    .pot-container {
      width: 100%;
      max-width: 360px;
      height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 20px;
    }

    .pot-svg {
      width: 160px;
      height: 200px;
      cursor: pointer;
      filter: drop-shadow(0 8px 15px rgba(230, 190, 100, 0.3));
      transition: transform 0.2s;
    }

    .pot-svg:active {
      transform: scale(0.95);
    }

    /* 搖晃動畫 */
    .shake {
      animation: potShake 0.6s ease-in-out infinite;
    }

    @keyframes potShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-8deg) translateY(-4px); }
      40% { transform: rotate(8deg) translateY(-2px); }
      60% { transform: rotate(-6deg) translateY(-4px); }
      80% { transform: rotate(6deg) translateY(-1px); }
    }

    /* 抽出的竹籤 */
    .stick {
      position: absolute;
      top: 40px;
      width: 28px;
      height: 140px;
      background: #F4C472;
      border: 2px solid #D69E43;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      writing-mode: vertical-rl;
      font-weight: 900;
      font-size: 0.9rem;
      color: #5A4A42;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      opacity: 0;
      transform: translateY(40px) scale(0.8);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
    }

    .stick.pop-out {
      opacity: 1;
      transform: translateY(-50px) scale(1.1);
    }

    /* 結果展示卡片 */
    .result-card {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 3.5px solid var(--border-color);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 20px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .food-tag {
      display: inline-block;
      background: var(--soft-yellow);
      color: var(--accent-orange);
      font-size: 0.8rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1.5px solid var(--border-color);
    }

    .food-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .food-desc {
      font-size: 0.85rem;
      color: var(--light-text);
      font-weight: 700;
      line-height: 1.4;
    }

    .action-btn {
      width: 100%;
      max-width: 360px;
      background: linear-gradient(135deg, var(--primary-yellow) 0%, #FFD000 100%);
      color: var(--text-color);
      border: 2.5px solid var(--border-color);
      padding: 14px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 210, 0, 0.3);
      transition: transform 0.15s;
    }

    .action-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <header>
    <h1>🍱 今天吃什麼？</h1>
    <div class="sub-title">台灣鹹食隨機抽籤筒 • 拯救正餐選擇困難！</div>
  </header>

  <!-- 籤筒區域 -->
  <div class="pot-container">
    <!-- 抽出之竹籤 -->
    <div class="stick" id="stick">大吉</div>

    <!-- 籤筒 SVG -->
    <svg class="pot-svg" id="pot" viewBox="0 0 100 120" onclick="drawFood()">
      <!-- 籤筒內的竹籤群 -->
      <rect x="35" y="15" width="5" height="40" rx="2" fill="#E2AC53" transform="rotate(-12 37 35)"/>
      <rect x="45" y="10" width="5" height="45" rx="2" fill="#F4C472" transform="rotate(-4 47 32)"/>
      <rect x="52" y="12" width="5" height="42" rx="2" fill="#E2AC53" transform="rotate(6 54 33)"/>
      <rect x="60" y="18" width="5" height="38" rx="2" fill="#F4C472" transform="rotate(15 62 37)"/>

      <!-- 籤筒筒身 -->
      <path d="M 20 40 L 25 110 C 25 113, 28 115, 32 115 L 68 115 C 72 115, 75 110 L 80 40 Z" fill="#FF9B42" stroke="#5A4A42" stroke-width="3"/>
      <!-- 籤筒口緣 -->
      <ellipse cx="50" cy="40" rx="30" ry="6" fill="#FFB766" stroke="#5A4A42" stroke-width="3"/>
      <!-- 籤筒裝飾條與文字 -->
      <rect x="23" y="65" width="54" height="28" rx="4" fill="#FFFDF2" stroke="#F7E7C4" stroke-width="2"/>
      <text x="50" y="84" font-size="14" font-weight="900" fill="#D85A75" text-anchor="middle">籤筒</text>
    </svg>
  </div>

  <!-- 結果展示卡片 -->
  <div class="result-card">
    <div id="resultContent">
      <div class="food-tag">✨ 正餐想吃啥？</div>
      <div class="food-name">搖一搖籤筒！</div>
      <div class="food-desc">點擊下方按鈕或直接點擊籤筒抽取美食</div>
    </div>
  </div>

  <button class="action-btn" id="drawBtn" onclick="drawFood()">🎲 搖一搖，選今日正餐！</button>

  <script>
